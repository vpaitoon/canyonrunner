<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Canyon Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --slot-sky:#ffd98a;
    --sun-wall:#e0763c;
    --mid-wall:#8c3a2e;
    --deep-wall:#2a1220;
    --shadow:#150a13;
    --chalk:#f6efe2;
    --water:#2f9c9a;
    --heat:#ffb03a;
    --danger:#ff4d4d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--shadow);
    overflow:hidden;
    font-family:'Barlow Condensed',system-ui,sans-serif;
    color:var(--chalk);
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    overscroll-behavior:none;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#0c0610;
  }
  #wrap{
    position:relative;
    height:100%;width:100%;
    max-width:min(100vw, calc(100vh * 0.62));
    box-shadow:0 0 80px rgba(0,0,0,.9);
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;}

  /* ---------- overlay cards ---------- */
  .card{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;
    padding:28px;
    text-align:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(21,10,19,.72), rgba(12,6,16,.94));
    backdrop-filter:blur(2px);
    z-index:5;
  }
  .card.hidden{display:none;}
  .eyebrow{
    font-size:13px;letter-spacing:.42em;text-transform:uppercase;
    font-weight:600;color:rgba(246,239,226,.55);
  }
  h1{
    font-family:'Anton',Impact,sans-serif;
    font-weight:400;
    font-size:clamp(38px,10.5vw,72px);
    line-height:.88;
    letter-spacing:.005em;
    text-transform:uppercase;
    color:var(--chalk);
    text-shadow:0 3px 0 var(--mid-wall), 0 6px 22px rgba(0,0,0,.7);
  }
  h1 .line2{display:block;color:var(--sun-wall);}
  .slot{
    width:2px;height:52px;
    background:linear-gradient(to bottom, rgba(255,232,168,0), var(--sun-wall));
    margin-bottom:2px;
  }
  h2{
    font-family:'Anton',Impact,sans-serif;font-weight:400;
    font-size:clamp(30px,8vw,52px);line-height:.9;text-transform:uppercase;
  }
  .rule{width:62px;height:3px;background:var(--sun-wall);}
  .keys{
    display:flex;flex-direction:column;gap:9px;
    margin-top:6px;font-size:17px;letter-spacing:.06em;
    color:rgba(246,239,226,.8);max-width:300px;
  }
  .keys b{color:var(--chalk);font-weight:700;}
  .prompt{
    margin-top:16px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:600;color:rgba(246,239,226,.5);
    animation:blink 1.5s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  .stars{display:flex;gap:12px;font-size:40px;line-height:1;}
  .star{color:rgba(246,239,226,.16);}
  .star.on{color:var(--heat);text-shadow:0 0 18px rgba(255,176,58,.5);}
  .statline{
    display:flex;gap:26px;margin-top:6px;
    font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(246,239,226,.62);
  }
  .statline b{display:block;font-size:26px;color:var(--chalk);letter-spacing:0;font-weight:700;}
  .reason{font-size:19px;letter-spacing:.05em;color:rgba(246,239,226,.75);max-width:280px;}
  /* ---------- level name flash ---------- */
  #levelCard{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;z-index:4;
  }
  #levelCard.show{animation:levelFlash 3.4s cubic-bezier(.16,.8,.3,1) forwards;}
  @keyframes levelFlash{
    0%{opacity:0;transform:scale(1.07);}
    10%{opacity:1;transform:scale(1);}
    72%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(.99);}
  }
  .lvl-band{
    width:100%;padding:22px 26px;text-align:center;
    background:linear-gradient(90deg, rgba(21,10,19,0), rgba(21,10,19,.88) 18%, rgba(21,10,19,.88) 82%, rgba(21,10,19,0));
    border-top:2px solid rgba(224,118,60,.55);
    border-bottom:2px solid rgba(224,118,60,.55);
  }
  .lvl-num{
    font-size:14px;letter-spacing:.5em;text-transform:uppercase;
    font-weight:700;color:var(--sun-wall);margin-bottom:8px;
  }
  .lvl-name{
    font-family:'Anton',Impact,sans-serif;font-weight:400;
    font-size:clamp(26px,7.6vw,44px);line-height:1;
    text-transform:uppercase;color:var(--chalk);
    text-shadow:0 3px 16px rgba(0,0,0,.8);
  }
  @media (prefers-reduced-motion: reduce){
    .prompt{animation:none;opacity:.7}
    #levelCard.show{animation:levelFlashPlain 3.4s linear forwards;}
    @keyframes levelFlashPlain{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="c"></canvas>

    <div class="card" id="titleCard">
      <div class="slot"></div>
      <div class="eyebrow">Rappel the slot</div>
      <h1>Canyon<span class="line2">Runner</span></h1>
      <div class="rule"></div>
      <div class="keys">
        <div><b>Hold</b> anywhere to work the brake</div>
        <div><b>Let go</b> to drop fast</div>
        <div><b>Swipe</b> left or right to kick off the wall</div>
      </div>
      <div class="prompt">Tap to drop in</div>
    </div>

    <div id="levelCard">
      <div class="lvl-band">
        <div class="lvl-num" id="lvlNum">Level 1</div>
        <div class="lvl-name" id="lvlName">Bruce's Magical Journey</div>
      </div>
    </div>

    <div class="card hidden" id="endCard">
      <div class="eyebrow" id="endEyebrow">Canyon floor</div>
      <h2 id="endTitle">Bruce made it</h2>
      <div class="reason" id="endReason"></div>
      <div class="stars" id="stars"></div>
      <div class="statline">
        <div>Depth<b id="statDepth">0m</b></div>
        <div>Time<b id="statTime">0.0s</b></div>
        <div>Score<b id="statScore">0</b></div>
      </div>
      <div class="prompt">Tap to run it again</div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   BRUCE'S MAGICAL JOURNEY — rappelling prototype
   Core loop: hold = brake, release = drop, swipe = pendulum swing.
   Rope heat punishes long fast descents. Canyon has a bottom.
   ============================================================ */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const titleCard = document.getElementById('titleCard');
const endCard = document.getElementById('endCard');
const levelCard = document.getElementById('levelCard');

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = wrap.clientWidth; H = wrap.clientHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- tuning ---------------- */
const T = {
  visibleMeters: 145,     // how much canyon fits on screen
  anchorY: 0.30,          // where the climber sits vertically
  fastSpeed: 60,          // m/s, brake off
  slowSpeed: 17,          // m/s, brake on
  accel: 105,             // m/s^2 toward target speed
  swingK: 27,             // pendulum spring constant
  swingDamp: 0.55,        // damping per second
  swingKick: 3.6,         // impulse from one swipe
  playerHalfW: 0.115,     // in normalized canyon units (-1 .. 1)
  playerHalfD: 6,         // meters
  heatUp: 0.255,          // per second at full speed
  heatDown: 0.50,         // per second while braking
  heatWaterfall: 1.4,     // per second inside a waterfall
  heatOnHit: 0.13,
  nearMissWindow: 0.10,   // normalized gap that counts as a near miss
  grip: 3
};

/* ---------------- level ---------------- */
// side: -1 left wall, +1 right wall. reach: 0..2 across the canyon.
const rock  = (d, side, reach, thick=15) => ({t:'rock', d, side, reach, thick});
const chock = (d, gapW, amp, rate, phase=0, thick=20) => ({t:'chock', d, gapW, amp, rate, phase, thick});
const fall  = (d, len) => ({t:'fall', d, len});
const ledge = (d, x1, x2, thick=17) => ({t:'ledge', d, x1, x2, thick});

const LEVEL = {
  number: 1,
  name: "Bruce's Magical Journey",
  depth: 2050,
  par: 52,
  build(){
    return [
      // --- act 1: swipe only, generous spacing ---
      rock(150, -1, 0.85),
      rock(255, +1, 0.85),
      rock(360, -1, 0.95),

      // --- first brake gate: you cannot pass this without holding ---
      chock(470, 0.72, 0.42, 1.05, 0),

      rock(575, +1, 0.9),
      rock(650, -1, 0.9),
      fall(715, 60),
      rock(830, +1, 1.0),
      rock(895, -1, 1.0),

      // --- ledge: costs time, teaches that stopping is bad ---
      ledge(975, -0.34, 0.34),

      chock(1080, 0.62, 0.5, 1.35, 1.2),

      rock(1180, -1, 1.05),
      rock(1240, +1, 1.05),
      rock(1300, -1, 0.8),
      rock(1350, +1, 1.1),

      fall(1420, 70),
      chock(1530, 0.56, 0.55, 1.6, 0.4),

      rock(1625, +1, 1.1),
      rock(1678, -1, 1.1),
      ledge(1740, -0.2, 0.55),
      rock(1800, -1, 1.15),
      rock(1852, +1, 1.15),
      rock(1904, -1, 1.0),
      chock(1975, 0.58, 0.5, 1.5, 2.1)
    ];
  }
};

/* ---------------- state ---------------- */
const G = {
  mode:'title',      // title | play | end
  t:0,               // seconds since run start
  clock:0,           // absolute time, drives chockstone gaps
  depth:0,
  speed:0,
  x:0, vx:0,
  heat:0,
  grip:T.grip,
  hits:0,
  nearMisses:0,
  combo:1,
  score:0,
  obstacles:[],
  stallT:0,          // descent frozen (ledge / hit recoil)
  invuln:0,
  shake:0,
  slowmo:0,
  brake:false,
  wetness:0,
  hint:null,
  hintT:0,
  hintPending:null,
  particles:[],
  ended:null
};

function reset(){
  G.mode='play'; G.t=0; G.depth=0; G.speed=T.slowSpeed;
  G.x=0; G.vx=0; G.heat=0; G.grip=T.grip; G.hits=0;
  G.nearMisses=0; G.combo=1; G.score=0;
  G.stallT=0; G.invuln=0; G.shake=0; G.slowmo=0;
  G.wetness=0; G.particles.length=0; G.ended=null;
  G.obstacles = LEVEL.build().map(o => ({...o, passed:false, hit:false}));
  G.hint = null; G.hintT = 0;
  // the swipe prompt waits for the level card to clear so they never overlap
  G.hintPending = {kind:'swipe', at:3.5, dur:2.6};
  titleCard.classList.add('hidden');
  endCard.classList.add('hidden');
  flashLevel();
}

function flashLevel(){
  document.getElementById('lvlNum').textContent = 'Level ' + LEVEL.number;
  document.getElementById('lvlName').textContent = LEVEL.name;
  levelCard.classList.remove('show');
  void levelCard.offsetWidth;      // restart the animation on every run
  levelCard.classList.add('show');
}

function showHint(kind, dur){ G.hint = kind; G.hintT = dur; }

/* ---------------- input ---------------- */
let ptrDown = false, ptrX = 0, swipedThisGesture = false;
const SWIPE_PX = 26;

function kick(dir){
  if(G.mode !== 'play') return;
  G.vx += dir * T.swingKick;
  puff(G.x, 0, dir);
  // a player who already found the swipe never needs to be told about it
  if(G.hintPending && G.hintPending.kind === 'swipe') G.hintPending = null;
  if(G.hint === 'swipe') G.hintT = Math.min(G.hintT, 0.4);
}

function press(x){
  if(G.mode === 'title'){ reset(); return; }
  if(G.mode === 'end'){ reset(); return; }
  ptrDown = true; ptrX = x; swipedThisGesture = false; G.brake = true;
}
function move(x){
  if(!ptrDown || G.mode !== 'play') return;
  const dx = x - ptrX;
  if(!swipedThisGesture && Math.abs(dx) > SWIPE_PX){
    swipedThisGesture = true;
    kick(Math.sign(dx));
  }
}
function release(){ ptrDown = false; G.brake = false; }

cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); press(e.clientX); }, {passive:true});
cv.addEventListener('pointermove', e => move(e.clientX), {passive:true});
cv.addEventListener('pointerup', release, {passive:true});
cv.addEventListener('pointercancel', release, {passive:true});
// cards swallow their own taps so the canvas listener doesn't need to see them
titleCard.addEventListener('pointerdown', () => reset(), {passive:true});
endCard.addEventListener('pointerdown', () => reset(), {passive:true});

addEventListener('keydown', e => {
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k === ' ' || k === 'arrowdown' || k === 's'){
    e.preventDefault();
    if(G.mode !== 'play'){ reset(); return; }
    G.brake = true;
  }
  else if(k === 'arrowleft' || k === 'a'){ if(G.mode!=='play'){reset();return;} kick(-1); }
  else if(k === 'arrowright' || k === 'd'){ if(G.mode!=='play'){reset();return;} kick(1); }
  else if(k === 'enter' || k === 'r'){ if(G.mode !== 'play') reset(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(k === ' ' || k === 'arrowdown' || k === 's') G.brake = false;
});

/* ---------------- particles ---------------- */
function puff(nx, dy, dir){
  const px = toScreenX(nx), py = H * T.anchorY + dy;
  for(let i=0;i<7;i++){
    G.particles.push({
      x:px, y:py,
      vx: -dir*(40+Math.random()*90), vy:(Math.random()-.5)*70 + 40,
      r: 2+Math.random()*4, life:.55, max:.55, c:'246,239,226'
    });
  }
}
function spark(nx, color='255,120,80'){
  const px = toScreenX(nx), py = H * T.anchorY;
  for(let i=0;i<16;i++){
    const a = Math.random()*Math.PI*2, s = 60+Math.random()*200;
    G.particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3,life:.5,max:.5,c:color});
  }
}

/* ---------------- geometry helpers ---------------- */
function inset(){ return W * 0.155; }
function toScreenX(nx){ return W/2 + nx * (W/2 - inset()); }
function pxPerM(){ return H / T.visibleMeters; }
function toScreenY(depth){ return H*T.anchorY + (depth - G.depth) * pxPerM(); }

// chockstone gap centre at a given moment
function gapAt(o, time){ return Math.sin(time * o.rate + o.phase) * o.amp; }

// horizontal span [x1,x2] a rock occupies
function rockSpan(o){
  return o.side < 0 ? [-1, -1 + o.reach] : [1 - o.reach, 1];
}

/* ---------------- simulation ---------------- */
function update(dtRaw){
  G.clock += dtRaw;

  if(G.mode !== 'play'){
    stepParticles(dtRaw);
    return;
  }

  // slow-motion on near misses
  const scale = G.slowmo > 0 ? 0.42 : 1;
  G.slowmo = Math.max(0, G.slowmo - dtRaw);
  const dt = dtRaw * scale;

  G.t += dtRaw;
  if(G.hintPending && G.t >= G.hintPending.at){
    showHint(G.hintPending.kind, G.hintPending.dur);
    G.hintPending = null;
  }
  G.hintT = Math.max(0, G.hintT - dtRaw);
  G.invuln = Math.max(0, G.invuln - dt);
  G.shake = Math.max(0, G.shake - dt * 3.2);
  G.wetness = Math.max(0, G.wetness - dt * 1.6);

  /* --- pendulum --- */
  G.vx += (-T.swingK * G.x) * dt;
  G.vx *= Math.pow(T.swingDamp, dt);
  G.x += G.vx * dt;
  if(G.x < -1){ G.x = -1; G.vx = Math.abs(G.vx) * 0.42; }
  if(G.x > 1){ G.x = 1; G.vx = -Math.abs(G.vx) * 0.42; }

  /* --- descent --- */
  if(G.stallT > 0){
    G.stallT -= dt;
    G.speed += (0 - G.speed) * Math.min(1, dt * 12);
  } else {
    const target = G.brake ? T.slowSpeed : T.fastSpeed;
    const d = target - G.speed;
    const step = T.accel * dt;
    G.speed += Math.abs(d) < step ? d : Math.sign(d) * step;
  }
  G.depth += G.speed * dt;

  /* --- rope heat --- */
  const speedFrac = Math.max(0, (G.speed - T.slowSpeed) / (T.fastSpeed - T.slowSpeed));
  let inFall = false;
  for(const o of G.obstacles){
    if(o.t === 'fall' && G.depth > o.d && G.depth < o.d + o.len){ inFall = true; break; }
  }
  if(inFall){
    G.heat -= T.heatWaterfall * dt;
    G.wetness = 1;
  } else if(G.brake || G.stallT > 0){
    G.heat -= T.heatDown * dt * (G.stallT > 0 ? 0.25 : 1);
  } else {
    G.heat += T.heatUp * dt * (0.35 + speedFrac);
  }
  G.heat = Math.max(0, Math.min(1, G.heat));
  if(G.heat >= 1){ finish(false, 'The rope glazed through'); return; }

  /* --- collisions --- */
  const pd = G.depth, px = G.x;
  for(const o of G.obstacles){
    if(o.t === 'fall') continue;
    const half = (o.thick || 15) / 2;
    const overlapD = Math.abs(pd - o.d) < half + T.playerHalfD;

    if(o.t === 'rock' || o.t === 'ledge'){
      const [x1, x2] = o.t === 'rock' ? rockSpan(o) : [o.x1, o.x2];
      const overlapX = px + T.playerHalfW > x1 && px - T.playerHalfW < x2;
      if(overlapD && overlapX && !o.hit && G.invuln <= 0){
        o.hit = true;
        if(o.t === 'ledge'){ stallOnLedge(); }
        else { takeHit(); }
      }
      // near miss: measured as we cross the obstacle's centre line
      if(!o.passed && pd > o.d){
        o.passed = true;
        if(!o.hit && o.t === 'rock'){
          const gap = px - T.playerHalfW > x2 ? (px - T.playerHalfW) - x2
                    : x1 - (px + T.playerHalfW);
          if(gap > 0 && gap < T.nearMissWindow) nearMiss();
        }
      }
    }

    if(o.t === 'chock'){
      const gc = gapAt(o, G.clock);
      const tol = o.gapW/2 - T.playerHalfW;
      const clear = Math.abs(px - gc) < tol;
      if(overlapD && !clear && !o.hit && G.invuln <= 0){ o.hit = true; takeHit(); }
      if(!o.passed && pd > o.d){
        o.passed = true;
        if(!o.hit){
          const edge = tol - Math.abs(px - gc);
          if(edge < T.nearMissWindow) nearMiss();
        }
      }
    }
  }

  /* --- hints --- */
  const nextChock = G.obstacles.find(o => o.t === 'chock' && !o.passed);
  if(nextChock && nextChock.d - pd < 105 && nextChock.d > pd && G.hint !== 'hold' && !nextChock.hinted){
    nextChock.hinted = true;
    if(nextChock === G.obstacles.find(o => o.t === 'chock')) showHint('hold', 2.2);
  }

  /* --- finish --- */
  if(G.depth >= LEVEL.depth){ G.depth = LEVEL.depth; finish(true, ''); return; }

  stepParticles(dt);
}

function takeHit(){
  G.hits++; G.grip--;
  G.combo = 1;
  G.heat = Math.min(1, G.heat + T.heatOnHit);
  G.shake = 1; G.invuln = 0.7; G.stallT = 0.28;
  G.vx *= -0.3;
  spark(G.x);
  if(G.grip <= 0){ finish(false, 'Bruce lost his grip'); }
}
function stallOnLedge(){
  G.stallT = 0.85; G.shake = 0.5; G.invuln = 0.9; G.combo = 1;
  puff(G.x, 8, 1); puff(G.x, 8, -1);
}
function nearMiss(){
  G.nearMisses++;
  G.combo = Math.min(8, G.combo + 1);
  G.score += 55 * G.combo;
  G.slowmo = 0.16;
  puff(G.x, 0, G.vx > 0 ? 1 : -1);
}

function stepParticles(dt){
  for(let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    if(p.life <= 0){ G.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt; p.vx *= 0.94;
  }
}

function finish(won, reason){
  G.mode = 'end';
  G.ended = {won, reason};
  G.score += Math.floor(G.depth);
  if(won && G.hits === 0) G.score += 600;
  if(won && G.t < LEVEL.par) G.score += 400;
  renderEndCard(won, reason);
}

/* ---------------- end card ---------------- */
function renderEndCard(won, reason){
  document.getElementById('endEyebrow').textContent = won ? 'Canyon floor — 2050m' : 'Run ended';
  document.getElementById('endTitle').textContent = won ? 'Bruce made it' : 'Bruce did not make it';
  document.getElementById('endReason').textContent = won
    ? (G.hits === 0 ? 'Not a scratch on him.' : 'Bruised, but down.')
    : reason;
  const earned = won ? 1 + (G.hits === 0 ? 1 : 0) + (G.t < LEVEL.par ? 1 : 0) : 0;
  const stars = document.getElementById('stars');
  stars.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('div');
    s.className = 'star' + (i < earned ? ' on' : '');
    s.textContent = '★';
    stars.appendChild(s);
  }
  document.getElementById('statDepth').textContent = Math.floor(G.depth) + 'm';
  document.getElementById('statTime').textContent = G.t.toFixed(1) + 's';
  document.getElementById('statScore').textContent = G.score.toLocaleString();
  endCard.classList.remove('hidden');
}

/* ============================================================
   RENDER
   ============================================================ */
function wallEdge(depth, side){
  // purely decorative wobble; always outside the playable inset
  const w = Math.sin(depth*0.0125 + (side<0?0:2.1)) * 0.5 + 0.5;
  const w2 = Math.sin(depth*0.041 + (side<0?1.3:4.0)) * 0.5 + 0.5;
  return (w*0.62 + w2*0.38) * (W*0.075);
}

function draw(){
  const shake = G.shake > 0 ? G.shake * 9 : 0;
  ctx.save();
  if(shake) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  drawBackground();
  drawWalls();
  drawStrata();
  drawObstacles();
  drawFinishFloor();
  drawSpeedLines();
  drawRope();
  drawPlayer();
  drawParticles();
  drawWater();

  ctx.restore();
  drawVignette();
  if(G.mode === 'play') drawHUD();
}

function drawBackground(){
  // depth-driven colour: bright sunlit slot up top, cold deep water at the bottom
  const p = Math.min(1, G.depth / LEVEL.depth);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, mix('#f0a85a','#5a2038', p*0.9));
  g.addColorStop(0.55, mix('#c25a35','#2d1024', p));
  g.addColorStop(1, mix('#5c2028','#120a18', p));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // the slot of sky, only visible near the top of the canyon
  if(G.depth < 320){
    const a = (1 - G.depth/320) * 0.85;
    const y = toScreenY(-40);
    ctx.fillStyle = `rgba(255,232,168,${a})`;
    ctx.fillRect(W*0.3, -H, W*0.4, Math.max(0, y + H));
  }
}

function drawWalls(){
  const step = 10;
  for(const side of [-1, 1]){
    ctx.beginPath();
    if(side < 0) ctx.moveTo(0, -20); else ctx.moveTo(W, -20);
    for(let y = -20; y <= H+20; y += step){
      const depth = G.depth + (y - H*T.anchorY)/pxPerM();
      const e = wallEdge(depth, side);
      const x = side < 0 ? toScreenX(-1) - 6 - e : toScreenX(1) + 6 + e;
      ctx.lineTo(x, y);
    }
    if(side < 0) ctx.lineTo(0, H+20); else ctx.lineTo(W, H+20);
    ctx.closePath();

    const g = ctx.createLinearGradient(side<0?0:W, 0, side<0?W*0.42:W*0.58, 0);
    const p = Math.min(1, G.depth/LEVEL.depth);
    g.addColorStop(0, mix('#3a1420','#0f0714', p));
    g.addColorStop(1, mix(side<0?'#a34430':'#8a3630','#3a1626', p));
    ctx.fillStyle = g;
    ctx.fill();

    // lit rim along the inner edge
    ctx.strokeStyle = `rgba(255,196,110,${0.5 - p*0.3})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawStrata(){
  // horizontal sediment bands — cheap, and they sell the descent speed
  const spacing = 22; // meters
  const first = Math.floor((G.depth - 30) / spacing) * spacing;
  ctx.save();
  ctx.globalAlpha = 0.16;
  for(let d = first; d < G.depth + T.visibleMeters; d += spacing){
    const y = toScreenY(d);
    if(y < -10 || y > H+10) continue;
    const e = wallEdge(d, -1), e2 = wallEdge(d, 1);
    ctx.strokeStyle = (Math.floor(d/spacing) % 2) ? '#ffd6a0' : '#4a1826';
    ctx.lineWidth = 3 + Math.sin(d*0.03)*1.5;
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(toScreenX(-1) - 6 - e, y + 5);
    ctx.moveTo(W, y); ctx.lineTo(toScreenX(1) + 6 + e2, y + 5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawObstacles(){
  for(const o of G.obstacles){
    if(o.t === 'fall'){
      const yTop = toScreenY(o.d), yBot = toScreenY(o.d + o.len);
      if(yBot < -40 || yTop > H+40) continue;
      ctx.save();
      const g = ctx.createLinearGradient(0,yTop,0,yBot);
      g.addColorStop(0,'rgba(190,240,245,0)');
      g.addColorStop(0.3,'rgba(190,240,245,0.42)');
      g.addColorStop(0.75,'rgba(150,220,235,0.36)');
      g.addColorStop(1,'rgba(190,240,245,0)');
      ctx.fillStyle = g;
      ctx.fillRect(toScreenX(-1)-30, yTop, toScreenX(1)-toScreenX(-1)+60, yBot-yTop);
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 2;
      for(let i=0;i<16;i++){
        const x = toScreenX(-1) - 20 + i*((toScreenX(1)-toScreenX(-1)+40)/15);
        const off = ((G.clock*900 + i*137) % 220);
        ctx.beginPath();
        ctx.moveTo(x, yTop + off - 60);
        ctx.lineTo(x + 3, yTop + off + 30);
        ctx.stroke();
      }
      ctx.restore();
      continue;
    }

    const half = (o.thick || 15)/2;
    const yTop = toScreenY(o.d - half), yBot = toScreenY(o.d + half);
    if(yBot < -60 || yTop > H+60) continue;
    const h = yBot - yTop;

    if(o.t === 'rock'){
      const [x1,x2] = rockSpan(o);
      boulder(toScreenX(x1), yTop, toScreenX(x2)-toScreenX(x1), h, o.side, o.d);
    }
    else if(o.t === 'ledge'){
      const x1 = toScreenX(o.x1), x2 = toScreenX(o.x2);
      ctx.fillStyle = '#1d0d18';
      roundRect(x1, yTop, x2-x1, h, 5); ctx.fill();
      ctx.fillStyle = '#c98a4a';
      ctx.fillRect(x1, yTop, x2-x1, 5);
      ctx.fillStyle = 'rgba(255,214,160,.35)';
      ctx.font = `600 ${Math.max(11, W*0.032)}px 'Barlow Condensed', sans-serif`;
      ctx.textAlign='center';
      ctx.fillText('LEDGE', (x1+x2)/2, yTop - 7);
    }
    else if(o.t === 'chock'){
      const gc = gapAt(o, G.clock);
      const gL = gc - o.gapW/2, gR = gc + o.gapW/2;
      boulder(toScreenX(-1.25), yTop, toScreenX(gL)-toScreenX(-1.25), h, -1, o.d);
      boulder(toScreenX(gR), yTop, toScreenX(1.25)-toScreenX(gR), h, 1, o.d);
      // the gap glows so the target reads instantly
      const gg = ctx.createLinearGradient(toScreenX(gL),0,toScreenX(gR),0);
      gg.addColorStop(0,'rgba(255,214,120,0)');
      gg.addColorStop(0.5,'rgba(255,214,120,0.30)');
      gg.addColorStop(1,'rgba(255,214,120,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(toScreenX(gL), yTop-4, toScreenX(gR)-toScreenX(gL), h+8);
    }
  }
}

function boulder(x, y, w, h, side, seed){
  if(w <= 0) return;
  ctx.save();
  ctx.beginPath();
  const bump = Math.abs(Math.sin(seed*0.7))*0.35 + 0.5;
  const r = Math.min(h*0.7, w*0.55);
  if(side < 0){
    ctx.moveTo(x - 4, y - 4);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w + r*bump, y + h/2, x + w - r*0.7, y + h);
    ctx.lineTo(x - 4, y + h + 4);
  } else {
    ctx.moveTo(x + w + 4, y - 4);
    ctx.lineTo(x + r, y);
    ctx.quadraticCurveTo(x - r*bump, y + h/2, x + r*0.7, y + h);
    ctx.lineTo(x + w + 4, y + h + 4);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(x, y, x + (side<0?w:-w), y+h);
  g.addColorStop(0, '#3d1a22');
  g.addColorStop(1, '#8f4a2c');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,130,.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawFinishFloor(){
  const y = toScreenY(LEVEL.depth);
  if(y > H + 60) return;
  const g = ctx.createLinearGradient(0, y-40, 0, H);
  g.addColorStop(0,'rgba(47,156,154,0)');
  g.addColorStop(0.35,'rgba(47,156,154,.75)');
  g.addColorStop(1,'rgba(20,90,105,.95)');
  ctx.fillStyle = g;
  ctx.fillRect(0, y-40, W, H-(y-40)+40);
  ctx.strokeStyle = 'rgba(220,255,250,.8)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
}

function drawSpeedLines(){
  const f = Math.max(0, (G.speed - T.slowSpeed*1.4) / T.fastSpeed);
  if(f <= 0.02) return;
  ctx.save();
  ctx.globalAlpha = f * 0.5;
  ctx.strokeStyle = '#ffe9c4'; ctx.lineWidth = 2;
  for(let i=0;i<14;i++){
    const x = ((i*97 + Math.floor(G.clock*40)*13) % W);
    const y = ((i*211 + G.depth*pxPerM()*1.6) % (H+220)) - 110;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40 + f*90); ctx.stroke();
  }
  ctx.restore();
}

function drawRope(){
  const px = toScreenX(G.x), py = H*T.anchorY;
  ctx.save();
  ctx.strokeStyle = 'rgba(250,236,200,.9)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2 + G.x*10, -20);
  ctx.quadraticCurveTo(W/2 + G.x*(W*0.12), py*0.45, px, py);
  ctx.stroke();
  if(G.heat > 0.5){
    ctx.globalAlpha = (G.heat-0.5)*2;
    ctx.strokeStyle = '#ff7a3a'; ctx.lineWidth = 5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlayer(){
  const px = toScreenX(G.x), py = H*T.anchorY;
  const lean = Math.max(-0.55, Math.min(0.55, G.vx*0.13));
  const s = Math.max(13, W*0.042);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(lean);
  if(G.invuln > 0 && Math.floor(G.clock*18)%2) ctx.globalAlpha = 0.35;

  // legs braced out toward the wall
  ctx.strokeStyle = '#20303c'; ctx.lineWidth = s*0.28; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0, s*0.3); ctx.lineTo(-s*0.55, s*1.1);
  ctx.moveTo(0, s*0.3); ctx.lineTo(s*0.2, s*1.15);
  ctx.stroke();

  // body / harness
  ctx.fillStyle = G.brake ? '#ffd36a' : '#e8f0f4';
  roundRect(-s*0.42, -s*0.55, s*0.84, s*1.0, s*0.3); ctx.fill();

  // helmet
  ctx.fillStyle = '#ff5c3a';
  ctx.beginPath(); ctx.arc(0, -s*0.78, s*0.42, 0, Math.PI*2); ctx.fill();

  // brake hand
  ctx.strokeStyle = '#20303c'; ctx.lineWidth = s*0.22;
  ctx.beginPath();
  ctx.moveTo(0,-s*0.2);
  ctx.lineTo(G.brake ? s*0.55 : -s*0.5, G.brake ? s*0.55 : -s*0.35);
  ctx.stroke();
  ctx.restore();

  // wet sheen after a waterfall
  if(G.wetness > 0){
    ctx.save();
    ctx.globalAlpha = G.wetness*0.28;
    ctx.fillStyle = '#bfeef6'; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of G.particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = `rgb(${p.c})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWater(){ /* reserved */ }

function drawVignette(){
  const f = Math.max(0, (G.speed - T.slowSpeed)/T.fastSpeed);
  const g = ctx.createRadialGradient(W/2,H*0.42, H*(0.26 - f*0.09), W/2,H*0.42, H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(10,4,12,${0.55 + f*0.28})`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if(G.heat > 0.7){
    ctx.fillStyle = `rgba(255,60,40,${(G.heat-0.7)/0.3*0.22*(0.6+0.4*Math.sin(G.clock*12))})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------------- HUD ---------------- */
function drawHUD(){
  const pad = Math.max(12, W*0.045);
  const fs = Math.max(13, W*0.038);
  ctx.save();
  ctx.font = `600 ${fs}px 'Barlow Condensed', sans-serif`;
  ctx.textBaseline = 'top';

  // depth remaining — the promise that this canyon has a bottom
  const left = Math.max(0, Math.ceil(LEVEL.depth - G.depth));
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(246,239,226,.55)';
  ctx.fillText('TO THE FLOOR', pad, pad);
  ctx.font = `700 ${fs*2.1}px 'Barlow Condensed', sans-serif`;
  ctx.fillStyle = '#f6efe2';
  ctx.fillText(left + 'm', pad, pad + fs*1.05);

  // grip pips
  ctx.textAlign = 'right';
  ctx.font = `600 ${fs}px 'Barlow Condensed', sans-serif`;
  ctx.fillStyle = 'rgba(246,239,226,.55)';
  ctx.fillText('GRIP', W - pad, pad);
  for(let i=0;i<T.grip;i++){
    const x = W - pad - i*(fs*0.95) - fs*0.4;
    const y = pad + fs*1.55;
    ctx.beginPath(); ctx.arc(x, y, fs*0.31, 0, Math.PI*2);
    ctx.fillStyle = i < G.grip ? '#ff5c3a' : 'rgba(246,239,226,.18)';
    ctx.fill();
  }

  // rope heat: the whole speed economy in one bar
  const bw = W - pad*2, bh = Math.max(9, fs*0.62);
  const by = H - pad - bh;
  ctx.fillStyle = 'rgba(10,5,12,.6)';
  roundRect(pad, by, bw, bh, bh/2); ctx.fill();
  const hg = ctx.createLinearGradient(pad,0,pad+bw,0);
  hg.addColorStop(0,'#ffd36a'); hg.addColorStop(0.6,'#ff9a3c'); hg.addColorStop(1,'#ff3b2f');
  ctx.fillStyle = hg;
  roundRect(pad, by, Math.max(bh, bw*G.heat), bh, bh/2); ctx.fill();
  ctx.strokeStyle = G.heat > 0.75 ? `rgba(255,80,60,${0.5+0.5*Math.sin(G.clock*14)})` : 'rgba(246,239,226,.28)';
  ctx.lineWidth = 2;
  roundRect(pad, by, bw, bh, bh/2); ctx.stroke();
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(246,239,226,.62)';
  ctx.font = `600 ${fs*0.82}px 'Barlow Condensed', sans-serif`;
  ctx.fillText('ROPE HEAT', pad, by - fs*1.05);

  // combo
  if(G.combo > 1){
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd36a';
    ctx.font = `700 ${fs*1.5}px 'Barlow Condensed', sans-serif`;
    ctx.fillText('×' + G.combo, W - pad, by - fs*2.0);
  }

  // hints — the entire tutorial
  if(G.hintT > 0){
    const a = Math.min(1, G.hintT) * (0.62 + 0.38*Math.sin(G.clock*5));
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f6efe2';
    ctx.font = `700 ${fs*1.5}px 'Barlow Condensed', sans-serif`;
    if(G.hint === 'swipe'){
      ctx.fillText('◀   SWIPE TO SWING   ▶', W/2, H*T.anchorY + fs*3.2);
    } else if(G.hint === 'hold'){
      ctx.fillText('HOLD TO BRAKE', W/2, H*T.anchorY + fs*3.2);
      ctx.font = `600 ${fs}px 'Barlow Condensed', sans-serif`;
      ctx.globalAlpha = a*0.8;
      ctx.fillText('time the gap', W/2, H*T.anchorY + fs*4.9);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------------- utils ---------------- */
function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function mix(a,b,t){
  const pa = [parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c = pa.map((v,i)=>Math.round(v+(pb[i]-v)*Math.max(0,Math.min(1,t))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
// idle drift on the title screen so the canyon is alive behind the card
G.obstacles = LEVEL.build().map(o => ({...o, passed:true, hit:false}));
requestAnimationFrame(frame);

})();
</script>
