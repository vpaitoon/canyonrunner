<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140b18">
<title>Canyon Runner</title>
<style>
  :root{
    --ink:#f4ece0;
    --ink-dim:rgba(244,236,224,0.58);
    --ink-faint:rgba(244,236,224,0.34);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:
      radial-gradient(120% 60% at 62% -10%, rgba(255,168,72,0.20), rgba(255,168,72,0) 60%),
      linear-gradient(#170d1c 0%, #0e070f 60%, #0a0509 100%);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding:max(28px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));
  }

  .shell{max-width:520px;margin:0 auto;}

  .masthead{padding:14px 4px 26px;}
  .wordmark{
    font-size:34px;font-weight:800;letter-spacing:-0.022em;line-height:1;margin:0;
  }
  .tagline{
    margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--ink-dim);max-width:34ch;
  }

  /* Each level is a band of rock. Stacked, they read as canyon strata. */
  .strata{display:flex;flex-direction:column;gap:12px;}

  .band{
    position:relative;display:flex;align-items:center;overflow:hidden;
    min-height:104px;padding:22px 24px;border-radius:16px;
    text-decoration:none;color:inherit;isolation:isolate;
    transition:transform 140ms ease, box-shadow 140ms ease;
  }
  .band::before{ /* the level's own palette */
    content:"";position:absolute;inset:0;z-index:-2;
    background:linear-gradient(104deg,var(--c1),var(--c2));
  }
  .band::after{ /* sandstone striation + scrim so type stays legible */
    content:"";position:absolute;inset:0;z-index:-1;
    background:
      repeating-linear-gradient(102deg,
        rgba(255,255,255,0.07) 0 3px,
        rgba(0,0,0,0.10) 3px 9px,
        rgba(255,255,255,0.03) 9px 16px),
      linear-gradient(90deg, rgba(12,6,14,0.74) 30%, rgba(12,6,14,0.18) 100%);
  }
  .band:active{transform:scale(0.985);}
  .band:focus-visible{outline:3px solid #ffd79a;outline-offset:3px;}

  .depth{
    position:absolute;right:16px;bottom:-16px;z-index:0;
    font-size:92px;font-weight:800;line-height:1;letter-spacing:-0.04em;
    color:rgba(255,255,255,0.13);pointer-events:none;
  }

  .name{
    margin:0;font-size:27px;font-weight:800;line-height:1.14;letter-spacing:-0.02em;
    max-width:16ch;position:relative;z-index:1;
  }

  .band.soon{pointer-events:none;}
  .band.soon .name{opacity:0.5;}
  .band.soon::after{background:linear-gradient(90deg,rgba(10,6,12,0.86),rgba(10,6,12,0.62));}

  .colophon{
    margin:30px 4px 0;font-size:12.5px;line-height:1.6;color:var(--ink-faint);
  }

  @media (prefers-reduced-motion:reduce){
    .band{transition:none;}
    .band:active{transform:none;}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <h1 class="wordmark">Canyon Runner</h1>
    <p class="tagline">Conquer the canyon one skill at a time.</p>
  </header>

  <nav class="strata" id="strata"></nav>

  <p class="colophon">Best on a phone. Works offline once loaded.</p>

</div>

<script>
/* ------------------------------------------------------------------
   ADDING A LEVEL
   1. Save the new level as its own file, e.g. levels/level3.html
   2. Add one entry to the list below.
   3. Done. Levels never touch each other's code.

   file: null  ->  shows as a dimmed band, nothing to click yet.
------------------------------------------------------------------- */
var LEVELS = [
  {
    n: 1,
    name: "Bruce's Magical Journey",
    file: 'level1.html',
    colors: ['#c25a35', '#2a0f22']
  },
  {
    n: 2,
    name: 'Karlyn Takes the High Road',
    file: 'level2.html',
    colors: ['#3a2340', '#e8a33d']
  }
];

var strata = document.getElementById('strata');

LEVELS.forEach(function(L){
  var el = document.createElement(L.file ? 'a' : 'div');
  el.className = 'band' + (L.file ? '' : ' soon');
  if(L.file) el.href = L.file;
  el.style.setProperty('--c1', L.colors[0]);
  el.style.setProperty('--c2', L.colors[1]);

  var name = document.createElement('p');
  name.className = 'name';
  name.textContent = L.name;

  var depth = document.createElement('span');
  depth.className = 'depth';
  depth.setAttribute('aria-hidden', 'true');
  depth.textContent = L.n;

  el.appendChild(name);
  el.appendChild(depth);
  strata.appendChild(el);
});
</script>
</body>
</html>
